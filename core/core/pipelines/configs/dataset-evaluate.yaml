# Pipeline: dataset-evaluate
# Evaluate model completions using MLflow scorers (runs locally)

pipeline: dataset-evaluate
description: "Evaluate completions from a dataset or file using MLflow scorers"
tags: [dataset, evaluate, mlflow]

entrypoint: core.pipelines.entrypoints.dataset_evaluate:run
environment: local

# --- Pipeline arguments ---
args:
  dataset_name:
    type: str
    required: true
    description: "Name of the completions file to evaluate"

  model_name:
    type: str
    default: "unnamed"
    description: "Model name for tracking purposes"

  container:
    type: str
    default: "llm-completions"
    description: "OVH storage container name"

  scorers:
    type: str
    default: null
    description: "Comma-separated list of scorer names to use"

  input_col:
    type: str
    default: "inputs"
    description: "Name of the column in the dataset containing the inputs text"

  output_col:
    type: str
    default: "outputs"
    description: "Name of the column in the dataset containing the model completions"

  expectation_col:
    type: str
    default: "expectations"
    description: "Name of the column in the dataset containing the expected outputs"

  id_col:
    type: str
    default: "id"
    description: "Name of the column in the dataset containing the id for each row"

# --- Tracking (MLflow) ---
tracking:
  project_name: "Default"
  enable_tracking: true
  enable_log_model: true
  enable_log_dataset: true
