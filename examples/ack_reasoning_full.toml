[job]
dump_folder = "?"
description = "Balanced 600M CPT on full 1.6M ack reasoning traces (3 epochs)"
print_config = true

[debug]
seed = 42

[profiling]
enable_profiling = false
save_traces_folder = "profile_trace"
profile_freq = 10
enable_memory_snapshot = false
save_memory_snapshot_folder = "memory_snapshot"

[metrics]
log_freq = 10
enable_tensorboard = false
enable_wandb = false
disable_color_printing = false

[model]
name = "qwen3"
flavor = "balanced-600M"
hf_assets_path = "pleias_65k_tokenizer"
converters = []

[optimizer]
name = "AdamW"
lr = 5e-5
eps = 1e-8
weight_decay = 0.01

[lr_scheduler]
warmup_steps = 100
decay_ratio = 0.25
decay_type = "linear"
min_lr_factor = 0.1

[training]
dataset = ["simple_custom"]
dataset_path = ["ack_reasoning_full_clean"]
dataset_key = ["text"]
dataset_split = ["train"]
dataset_streaming = true
local_batch_size = 8
global_batch_size = 512
seq_len = 2048
max_norm = 1.0
steps = 4770
dtype = "float32"
mixed_precision_param = "bfloat16"
mixed_precision_reduce = "float32"

[parallelism]
data_parallel_replicate_degree = 1
data_parallel_shard_degree = -1
tensor_parallel_degree = 1
pipeline_parallel_degree = 1
context_parallel_degree = 1

[checkpoint]
enable = true
folder = "checkpoint"
interval = 1590
export_dtype = "float32"
async_mode = "disabled"
initial_load_path = "annotation/balanced_600m/run_20260314/checkpoint/step-151000"
initial_load_model_only = true

[activation_checkpoint]
mode = "selective"
selective_ac_option = "2"

[compile]
enable = true
components = ["model", "loss"]
