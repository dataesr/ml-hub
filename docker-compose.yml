services:
  backend:
    build:
      context: .
      dockerfile: ./app/backend/dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ./app/backend/.env
    develop:
      watch:
        - action: sync
          path: ./app/backend
          target: /app/backend
          ignore:
            - __pycache__/
            - "*.pyc"

        - action: rebuild
          path: ./pyproject.toml
        
        - action: rebuild
          path: ./app/backend/pyproject.toml

        - action: rebuild
          path: ./uv.lock

        - action: rebuild
          path: ./app/backend/Dockerfile