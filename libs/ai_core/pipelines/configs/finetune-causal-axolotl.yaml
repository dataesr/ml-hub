# Pipeline: finetune-causal-axolotl
# Finetune a causal LM using Axolotl (image-native entrypoint)

pipeline: finetune-causal-axolotl
description: "Finetune a causal model with Axolotl"
tags: [finetuning, causallm, transformers, axolotl]

# No entrypoint — the Docker image has its own ENTRYPOINT
entrypoint: null
environment: cloud

# --- Pipeline arguments ---
args:
  config_name:
    type: str
    required: true
    description: "Name of the Axolotl config file (in configs/ volume)"

# --- Cloud infrastructure ---
cloud:
  image: "ghcr.io/dataesr/ml-hub/cuda-axolotl:latest"
  name: "finetune-causal-axolotl"
  command: []
  gpu: 1
  flavor: "l4-1-gpu"
  volumes:
    - container: llm-configs
      mount: configs
    - container: llm-datasets
      mount: datasets
    - container: llm-jobs
      mount: jobs
      permission: RWD
