# Pipeline: finetune-causal
# Finetune a causal LM with LoRA + BitsAndBytes (4-bit quantization)

pipeline: finetune-causal
description: "Finetune a causal model with LoRA and BitsAndBytes 4-bit quantization"
tags: [finetuning, causallm, transformers, lora, bitsandbytes]

entrypoint: ai_core.pipelines.entrypoints.finetune_causal:run
environment: cloud

# --- Pipeline arguments ---
args:
  model_name:
    type: str
    required: true
    description: "HuggingFace model name or path"

  dataset_name:
    type: str
    required: true
    description: "HuggingFace dataset name or local path"

  dataset_split:
    type: str
    default: "train"
    description: "Dataset split to use"

  prompts_config:
    type: str
    default: null
    description: "Name of the prompts YAML config (stored in configs/prompts/)"

  # LoRA parameters
  lora_r:
    type: int
    default: 16
    description: "LoRA rank"
  lora_alpha:
    type: int
    default: 32
    description: "LoRA alpha"
  lora_dropout:
    type: float
    default: 0.05
    description: "LoRA dropout rate"

  # Training parameters
  max_seq_length:
    type: int
    default: 8192
    description: "Maximum sequence length"
  epochs:
    type: int
    default: 3
    description: "Number of training epochs"
  max_steps:
    type: int
    default: -1
    description: "Max training steps (-1 for unlimited)"
  batch_size:
    type: int
    default: 1
    description: "Per-device train batch size"
  grad_acc_steps:
    type: int
    default: 4
    description: "Gradient accumulation steps"
  optim:
    type: str
    default: "paged_adamw_8bit"
    description: "Optimizer name"
  learning_rate:
    type: float
    default: 2e-5
    description: "Learning rate"
  lr_scheduler_type:
    type: str
    default: "linear"
    description: "Learning rate scheduler type"
  weight_decay:
    type: float
    default: 0.001
    description: "Weight decay"
  max_grad_norm:
    type: float
    default: 0.3
    description: "Maximum gradient norm for clipping"
  warmup_ratio:
    type: float
    default: 0.03
    description: "Warmup ratio"
  save_steps:
    type: int
    default: 500
    description: "Save checkpoint every N steps"
  logging_steps:
    type: int
    default: 50
    description: "Log metrics every N steps"

# --- Cloud infrastructure ---
cloud:
  image: "ghcr.io/dataesr/ml-hub/cuda-base:latest"
  name: "finetune-causallm"
  command: ["ai-pipeline-run"]
  gpu: 1
  flavor: "l4-1-gpu"
  volumes:
    - container: llm-configs
      mount: configs
    - container: llm-datasets
      mount: datasets
    - container: llm-jobs
      mount: jobs
      permission: RWD

# --- Tracking (MLflow) ---
tracking:
  project_name: "Default"
  enable_tracking: true
  enable_log_model: true
  enable_log_dataset: true
