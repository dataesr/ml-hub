[build-system]
requires = ["setuptools>=65.5.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-core" 
version = "0.1.0"
description = "AI core library for all ml-hub services."
readme = "README.md"
requires-python = ">=3.11.5"
license = { text = "MIT" }
authors = [
    { name="Victor Barbier", email="victor.barbier@recherche.gouv.fr" }
]

dependencies = [
    "pydantic==2.12.5",
    "datasets==4.4.1",
    "huggingface-hub==0.35.3",
    "mlflow==3.6.0",
    "pandas==2.3.3",
    "retry==0.9.2"
]

# [project.optional-dependencies]
# gpu = [
#     "torch>=2.0",
#     "transformers",
#     "accelerate",
# ]

[project.urls]
Homepage = "https://github.com/dataesr/ml-hub"
Documentation = "https://github.com/dataesr/ml-hub"


[tool.setuptools.packages.find]
where = ["."]
include = ["ai_core*"]